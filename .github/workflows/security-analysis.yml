name: Security Analysis

on:
  workflow_call:
    inputs:
      validation_key:
        description: Validation fingerprint supplied by Quality Checks
        required: false
        default: ""
        type: string
  schedule:
    - cron: "40 1 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install Semgrep
        run: python -m pip install --requirement requirements-security.txt

      - name: Scan repository
        run: semgrep scan --config .semgrep.yml --error --metrics=off .

      - name: Record successful security validation
        if: inputs.validation_key != ''
        env:
          VALIDATION_KEY: ${{ inputs.validation_key }}
        run: node scripts/ci-validation-reuse.mjs record security "$VALIDATION_KEY"

      - name: Upload security validation record
        if: inputs.validation_key != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-validation-security-${{ inputs.validation_key }}
          path: ${{ runner.temp }}/ci-validation/security.json
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ vars.CI_ARTIFACT_RETENTION_DAYS || '3' }}
