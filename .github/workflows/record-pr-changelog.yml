name: Record PR Changelog

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "目标为 main 的 PR 编号"
        required: true
        type: string
      chinese_change_summary:
        description: "可选：本次 PR 的中文变更说明（5-2000 字）；留空时由 OpenAI 自动总结"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  record:
    name: Analyze and Record Chinese Changelog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Analyze PR with OpenAI and record changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          MANUAL_CHANGELOG_SUMMARY: ${{ inputs.chinese_change_summary }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.krill-ai.net/codex/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          CHANGELOG_CHUNK_MAX_CHARS: ${{ vars.CHANGELOG_CHUNK_MAX_CHARS || '24000' }}
          CHANGELOG_ANALYSIS_CONCURRENCY: ${{ vars.CHANGELOG_ANALYSIS_CONCURRENCY || '3' }}
          CHANGELOG_GITHUB_READ_CONCURRENCY: ${{ vars.CHANGELOG_GITHUB_READ_CONCURRENCY || '5' }}
          CHANGELOG_BOT_LOGIN: ${{ vars.CHANGELOG_BOT_LOGIN || 'github-actions[bot]' }}
        run: node scripts/record-pr-changelog.mjs
