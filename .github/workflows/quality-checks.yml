name: Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  deploy-relevance:
    name: Deploy Relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_required: ${{ steps.check.outputs.deploy_required }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check deploy relevance
        id: check
        env:
          CACHED_COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/netlify-ignore-build.mjs --check

      - name: Write summary
        run: |
          echo "Deploy required: ${{ steps.check.outputs.deploy_required }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ steps.check.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  web-build:
    name: Web Build
    needs: deploy-relevance
    if: needs.deploy-relevance.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure build metadata
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          VERSION_PREFIX="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          APP_VERSION="${VERSION_PREFIX}.${COMMIT_COUNT}"
          GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GENERATED_AT=${GENERATED_AT}" >> "$GITHUB_ENV"
          echo "BUILD_CONTEXT=${GITHUB_EVENT_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "DATA_VERSION=data.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build web app
        run: npm run build

  functions-smoke-test:
    name: Functions Smoke Test
    needs: deploy-relevance
    if: needs.deploy-relevance.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure build metadata
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          VERSION_PREFIX="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          APP_VERSION="${VERSION_PREFIX}.${COMMIT_COUNT}"
          GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GENERATED_AT=${GENERATED_AT}" >> "$GITHUB_ENV"
          echo "BUILD_CONTEXT=${GITHUB_EVENT_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "DATA_VERSION=data.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Generate data
        run: npm run generate:data

      - name: Run functions smoke check
        run: npm run check:functions
