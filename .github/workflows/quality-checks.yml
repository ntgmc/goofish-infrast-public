name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  public-validation:
    name: Public Build, Tests, and Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public source and API boundaries
        run: |
          npm run check:catalog
          npm run check:architecture
          npm run check:dead-code
          npm run check:api

      - name: Run public tests
        run: |
          npm run test:generate-changelog
          npm run test:release-artifact
          npm test

      - name: Build public application
        env:
          REFRESH_BUILD_METADATA: "true"
          VERSION_SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_CONTEXT: public-quality-checks
          GENERATE_CHANGELOG_CANDIDATE: "false"
        run: |
          npm run build
          npm run check:public-export

      - name: Create and verify public artifact
        if: github.event_name == 'push'
        env:
          RELEASE_ROOT: ${{ github.workspace }}/.release-staging/public
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/stage-release-artifact.mjs --kind public --output .release-staging/public
          node scripts/release-artifact.mjs create --kind public --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-url "$GITHUB_RUN_URL"
          node scripts/release-artifact.mjs verify --kind public --sha "$GITHUB_SHA"
          mkdir -p .release-packages/public
          tar -C .release-staging/public -czf .release-packages/public/public.tgz dist server build-manifest.json changelog-release.json changelog-release.md
          (cd .release-packages/public && sha256sum public.tgz > public.tgz.sha256)

      - name: Upload public artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: goofish-public-${{ github.sha }}
          path: .release-packages/public/
          if-no-files-found: error
          retention-days: 30

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
