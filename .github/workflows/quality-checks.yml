name: Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure build metadata
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GENERATED_AT=${GENERATED_AT}" >> "$GITHUB_ENV"
          echo "BUILD_CONTEXT=${GITHUB_EVENT_NAME}" >> "$GITHUB_ENV"
          echo "FRONTEND_VERSION=frontend.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "BACKEND_VERSION=backend.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "DATA_VERSION=data.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build web app
        run: npm run build

  functions-smoke-test:
    name: Functions Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure build metadata
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GENERATED_AT=${GENERATED_AT}" >> "$GITHUB_ENV"
          echo "BUILD_CONTEXT=${GITHUB_EVENT_NAME}" >> "$GITHUB_ENV"
          echo "FRONTEND_VERSION=frontend.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "BACKEND_VERSION=backend.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "DATA_VERSION=data.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Generate data
        run: npm run generate:data

      - name: Smoke test functions
        run: npm run check:functions
