name: Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  static-security:
    name: Static Security Analysis
    permissions:
      contents: read
    uses: ./.github/workflows/security-analysis.yml

  build-relevance:
    name: Build Relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.check.outputs.build_required }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check build relevance
        id: check
        env:
          CACHED_COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-build-relevance.mjs --check

      - name: Write summary
        run: |
          echo "Build required: ${{ steps.check.outputs.build_required }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ steps.check.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  web-build:
    name: Web Build
    needs: build-relevance
    if: needs.build-relevance.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check product catalog and generated pricing
        run: npm run check:catalog

      - name: Build web app
        env:
          REFRESH_BUILD_METADATA: "true"
          VERSION_SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_CONTEXT: quality-checks
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm run build
          node scripts/release-artifact.mjs create \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_RUN_URL"

      - name: Package deployable release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-package
          tar -czf release-package/release.tgz dist server/dist build-manifest.json
          (cd release-package && sha256sum release.tgz > release.tgz.sha256)
          cp deployment-decision.json release-package/deployment-decision.json

      - name: Upload deployable release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goofish-release-${{ github.sha }}
          path: release-package/
          if-no-files-found: error
          retention-days: 30

  deployment-decision:
    name: Deployment Decision
    needs: build-relevance
    if: github.event_name != 'pull_request' && needs.build-relevance.outputs.build_required != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record skipped deployment
        env:
          DECISION_REASON: ${{ needs.build-relevance.outputs.reason }}
        run: |
          mkdir -p release-package
          RELEASE_ROOT="$PWD/release-package" node scripts/release-artifact.mjs decision \
            --sha "$GITHUB_SHA" \
            --reason "$DECISION_REASON"

      - name: Upload deployment decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goofish-release-${{ github.sha }}
          path: release-package/
          if-no-files-found: error
          retention-days: 30

  test-and-architecture:
    name: Unit Tests and Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate data
        run: npm run generate:data

      - name: Check dead code
        run: npm run check:dead-code

      - name: Run unit tests
        run: npm test

      - name: Check architecture boundaries
        run: npm run check:architecture

  api-smoke-test:
    name: API Smoke Test
    needs: build-relevance
    if: needs.build-relevance.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate data
        run: npm run generate:data

      - name: Check production deployment contract
        run: npm run check:deploy

      - name: Run API smoke check
        run: npm run check:api

      - name: Run PostgreSQL redemption integration tests
        run: npm run test:postgres
