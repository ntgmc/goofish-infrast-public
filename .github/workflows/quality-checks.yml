name: Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  refresh-build-metadata:
    name: Refresh Build Metadata
    if: >-
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build metadata
        env:
          VERSION_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_CONTEXT: ${{ github.event_name }}
        run: npm run generate:data

      - name: Commit generated metadata
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/build-meta.ts netlify/functions/data.ts
          if git diff --cached --quiet; then
            echo "Generated metadata is already up to date."
            exit 0
          fi
          git commit -m "ci: 自动更新构建版本元数据"
          git push origin "HEAD:${TARGET_BRANCH}"

  deploy-relevance:
    name: Deploy Relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_required: ${{ steps.check.outputs.deploy_required }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check deploy relevance
        id: check
        env:
          CACHED_COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/netlify-ignore-build.mjs --check

      - name: Write summary
        run: |
          echo "Deploy required: ${{ steps.check.outputs.deploy_required }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ steps.check.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  web-build:
    name: Web Build
    needs: deploy-relevance
    if: needs.deploy-relevance.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  functions-smoke-test:
    name: Functions Smoke Test
    needs: deploy-relevance
    if: needs.deploy-relevance.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate data
        run: npm run generate:data

      - name: Run functions smoke check
        run: npm run check:functions
