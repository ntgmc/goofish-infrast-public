name: Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  refresh-build-metadata:
    name: Refresh Build Metadata
    needs: build-relevance
    permissions:
      contents: write
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.ref == 'refs/heads/main' &&
      needs.build-relevance.outputs.build_required == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build metadata
        env:
          VERSION_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_CONTEXT: ${{ github.event_name }}
        run: npm run generate:data -- --refresh-metadata

      - name: Commit generated metadata
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/build-meta.ts server/handlers/data.ts
          if git diff --cached --quiet; then
            echo "Generated metadata is already up to date."
            exit 0
          fi
          git commit -m "ci: 自动更新构建版本元数据"
          git push origin "HEAD:${TARGET_BRANCH}"

  build-relevance:
    name: Build Relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.check.outputs.build_required }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check build relevance
        id: check
        env:
          CACHED_COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-build-relevance.mjs --check

      - name: Write summary
        run: |
          echo "Build required: ${{ steps.check.outputs.build_required }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ steps.check.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  web-build:
    name: Web Build
    needs: build-relevance
    if: needs.build-relevance.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  api-smoke-test:
    name: API Smoke Test
    needs: build-relevance
    if: needs.build-relevance.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate data
        run: npm run generate:data

      - name: Run API smoke check
        run: npm run check:api

      - name: Run unit tests
        run: npm test

      - name: Run PostgreSQL redemption integration tests
        run: npm run test:postgres
