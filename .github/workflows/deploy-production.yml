name: Deploy Production

on:
  workflow_run:
    workflows:
      - Quality Checks
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to redeploy (must have successful Quality Checks)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable release to blue/green production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.actor.login != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/goofish-infrast-v1' }}
      DEPLOY_REPO_DIR: ${{ vars.DEPLOY_REPO_DIR || '/opt/goofish-infrast-v1/repository' }}
      DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME || 'goofish-infrast-v1' }}
      DEPLOY_MIGRATION_SERVICE_NAME: ${{ vars.DEPLOY_MIGRATION_SERVICE_NAME || 'goofish-database-migrate.service' }}
      DEPLOY_PUBLIC_BASE_URL: ${{ vars.DEPLOY_PUBLIC_BASE_URL || 'https://maatool.com' }}
      DEPLOY_BLUE_PORT: ${{ vars.DEPLOY_BLUE_PORT || '3000' }}
      DEPLOY_GREEN_PORT: ${{ vars.DEPLOY_GREEN_PORT || '3002' }}
      WORKER_DEPLOY_HOST: ${{ secrets.WORKER_DEPLOY_HOST }}
      WORKER_DEPLOY_USER: ${{ secrets.WORKER_DEPLOY_USER }}
      WORKER_DEPLOY_SSH_KEY: ${{ secrets.WORKER_DEPLOY_SSH_KEY }}
      WORKER_DEPLOY_KNOWN_HOSTS: ${{ secrets.WORKER_DEPLOY_KNOWN_HOSTS }}
      WORKER_DEPLOY_PORT: ${{ vars.WORKER_DEPLOY_PORT || '22' }}
      WORKER_DEPLOY_ROOT: ${{ vars.WORKER_DEPLOY_ROOT || '/opt/goofish-infrast-v1-worker' }}
      WORKER_DEPLOY_REPO_DIR: ${{ vars.WORKER_DEPLOY_REPO_DIR || '/opt/goofish-infrast-v1-worker/repository' }}
      WORKER_DEPLOY_SERVICE_NAME: ${{ vars.WORKER_DEPLOY_SERVICE_NAME || 'goofish-optimize-worker' }}
      WORKER_BLUE_HEALTH_PORT: ${{ vars.WORKER_BLUE_HEALTH_PORT || '3010' }}
      WORKER_GREEN_HEALTH_PORT: ${{ vars.WORKER_GREEN_HEALTH_PORT || '3012' }}

    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_ROOT DEPLOY_REPO_DIR DEPLOY_SERVICE_NAME DEPLOY_PUBLIC_BASE_URL WORKER_DEPLOY_HOST WORKER_DEPLOY_USER WORKER_DEPLOY_SSH_KEY WORKER_DEPLOY_KNOWN_HOSTS WORKER_DEPLOY_ROOT WORKER_DEPLOY_REPO_DIR WORKER_DEPLOY_SERVICE_NAME; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production deployment settings: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'DEPLOY_PORT must be numeric' >&2; exit 1; }
          [[ "$DEPLOY_BLUE_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'DEPLOY_BLUE_PORT must be numeric' >&2; exit 1; }
          [[ "$DEPLOY_GREEN_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'DEPLOY_GREEN_PORT must be numeric' >&2; exit 1; }
          [[ "$WORKER_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'WORKER_DEPLOY_PORT must be numeric' >&2; exit 1; }
          [[ "$WORKER_BLUE_HEALTH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'WORKER_BLUE_HEALTH_PORT must be numeric' >&2; exit 1; }
          [[ "$WORKER_GREEN_HEALTH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'WORKER_GREEN_HEALTH_PORT must be numeric' >&2; exit 1; }
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo 'DEPLOY_PORT is outside 1-65535' >&2; exit 1; }
          (( DEPLOY_BLUE_PORT >= 1 && DEPLOY_BLUE_PORT <= 65535 )) || { echo 'DEPLOY_BLUE_PORT is outside 1-65535' >&2; exit 1; }
          (( DEPLOY_GREEN_PORT >= 1 && DEPLOY_GREEN_PORT <= 65535 )) || { echo 'DEPLOY_GREEN_PORT is outside 1-65535' >&2; exit 1; }
          (( WORKER_DEPLOY_PORT >= 1 && WORKER_DEPLOY_PORT <= 65535 )) || { echo 'WORKER_DEPLOY_PORT is outside 1-65535' >&2; exit 1; }
          (( WORKER_BLUE_HEALTH_PORT >= 1 && WORKER_BLUE_HEALTH_PORT <= 65535 )) || { echo 'WORKER_BLUE_HEALTH_PORT is outside 1-65535' >&2; exit 1; }
          (( WORKER_GREEN_HEALTH_PORT >= 1 && WORKER_GREEN_HEALTH_PORT <= 65535 )) || { echo 'WORKER_GREEN_HEALTH_PORT is outside 1-65535' >&2; exit 1; }
          [[ "$WORKER_BLUE_HEALTH_PORT" != "$WORKER_GREEN_HEALTH_PORT" ]] || { echo 'worker health ports must differ' >&2; exit 1; }
          [[ "$DEPLOY_SERVICE_NAME" =~ ^[A-Za-z0-9_.@-]+$ ]] || { echo 'DEPLOY_SERVICE_NAME contains unsafe characters' >&2; exit 1; }
          [[ "$DEPLOY_MIGRATION_SERVICE_NAME" =~ ^[A-Za-z0-9_.@-]+\.service$ ]] || { echo 'DEPLOY_MIGRATION_SERVICE_NAME contains unsafe characters' >&2; exit 1; }
          [[ "$WORKER_DEPLOY_SERVICE_NAME" =~ ^[A-Za-z0-9_.@-]+$ ]] || { echo 'WORKER_DEPLOY_SERVICE_NAME contains unsafe characters' >&2; exit 1; }
          for path in "$DEPLOY_ROOT" "$DEPLOY_REPO_DIR" "$WORKER_DEPLOY_ROOT" "$WORKER_DEPLOY_REPO_DIR"; do
            [[ "$path" == /* && "$path" != *$'\n'* ]] || { echo "unsafe absolute deployment path: $path" >&2; exit 1; }
          done

      - name: Resolve immutable target SHA
        id: target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RAW_TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha }}
        with:
          script: |
            const automatic = context.eventName === 'workflow_run'
            const sha = String(process.env.RAW_TARGET_SHA || '').trim().toLowerCase()

            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Production deployments require a full 40-character commit SHA.')
              return
            }

            if (!automatic) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'quality-checks.yml',
                head_sha: sha,
                status: 'completed',
                per_page: 100,
              })
              const accepted = runs.find((run) =>
                run.head_sha === sha &&
                run.head_branch === 'main' &&
                run.conclusion === 'success' &&
                ['push', 'workflow_dispatch'].includes(run.event)
              )
              if (!accepted) {
                core.setFailed(`No successful main Quality Checks run exists for ${sha}.`)
                return
              }
              core.info(`Authorized by Quality Checks run ${accepted.html_url}`)
              core.setOutput('run_id', String(accepted.id))
            } else {
              core.setOutput('run_id', String(context.payload.workflow_run.id))
            }

            core.setOutput('sha', sha)
            core.setOutput('allow_redeploy', automatic ? 'false' : 'true')

      - name: Verify target belongs to main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Validate target ancestry
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "$TARGET_SHA is not an ancestor of origin/main" >&2
            exit 1
          }

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$WORKER_DEPLOY_SSH_KEY" > ~/.ssh/worker_deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/worker_deploy_key

          {
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS"
            printf '%s\n' "$WORKER_DEPLOY_KNOWN_HOSTS"
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Download verified release decision
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: goofish-deployment-${{ steps.target.outputs.sha }}
          path: release-decision
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate deployment decision
        id: artifact
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const decision = JSON.parse(readFileSync('release-decision/deployment-decision.json', 'utf8'))
          if (decision.target_sha !== process.env.TARGET_SHA) throw new Error('deployment decision SHA mismatch')
          NODE
          deployable="$(node -p "JSON.parse(require('fs').readFileSync('release-decision/deployment-decision.json')).deployable")"
          echo "deployable=$deployable" >> "$GITHUB_OUTPUT"

      - name: Download public release
        if: steps.artifact.outputs.deployable == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: goofish-public-${{ steps.target.outputs.sha }}
          path: public-package
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download worker release
        if: steps.artifact.outputs.deployable == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: goofish-worker-${{ steps.target.outputs.sha }}
          path: worker-package
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate role-specific release archives
        id: archives
        if: steps.artifact.outputs.deployable == 'true'
        run: |
          set -euo pipefail
          (cd public-package && sha256sum -c public.tgz.sha256)
          (cd worker-package && sha256sum -c worker.tgz.sha256)
          echo "public_archive_sha=$(cut -d ' ' -f1 public-package/public.tgz.sha256)" >> "$GITHUB_OUTPUT"
          echo "worker_archive_sha=$(cut -d ' ' -f1 worker-package/worker.tgz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Extract generated changelog release
        id: changelog
        if: steps.artifact.outputs.deployable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf public-package/public.tgz changelog-release.json changelog-release.md
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const envelope = JSON.parse(readFileSync('changelog-release.json', 'utf8'))
          if (envelope.schema_version !== 1 || typeof envelope.candidate !== 'boolean') {
            throw new Error('invalid changelog release envelope')
          }
          if (!envelope.candidate) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'candidate=false\n', 'utf8')
            process.exit(0)
          }

          const release = envelope.release
          if (!release || !/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(release.version || '')) {
            throw new Error('invalid changelog release version')
          }
          if (release.targetSha !== process.env.TARGET_SHA) throw new Error('changelog release target SHA mismatch')
          appendFileSync(process.env.GITHUB_OUTPUT, [
            'candidate=true',
            `version=${release.version}`,
            `tag=v${release.version}`,
          ].join('\n') + '\n', 'utf8')
          NODE
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}

      - name: Skip non-build deployment
        if: steps.artifact.outputs.deployable != 'true'
        run: echo 'Quality Checks marked this commit as not requiring deployment.'

      - name: Upload verified artifact and database migration script
        if: steps.artifact.outputs.deployable == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          remote_artifact="/tmp/goofish-migration-release-${TARGET_SHA}-${GITHUB_RUN_ID}.tgz"
          remote_deploy_script="/tmp/goofish-migration-deploy-${TARGET_SHA}-${GITHUB_RUN_ID}.sh"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            public-package/public.tgz "$DEPLOY_USER@$DEPLOY_HOST:$remote_artifact"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            scripts/deploy-production-atomic.sh "$DEPLOY_USER@$DEPLOY_HOST:$remote_deploy_script"
          echo "MIGRATION_REMOTE_ARTIFACT=$remote_artifact" >> "$GITHUB_ENV"
          echo "MIGRATION_REMOTE_DEPLOY_SCRIPT=$remote_deploy_script" >> "$GITHUB_ENV"

      - name: Apply controlled database migration first
        if: steps.artifact.outputs.deployable == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_SHA256: ${{ steps.archives.outputs.public_archive_sha }}
        run: |
          set -euo pipefail

          remote_command="TARGET_SHA=${TARGET_SHA@Q} MIGRATION_ONLY=true DEPLOY_ROOT=${DEPLOY_ROOT@Q} REPO_DIR=${DEPLOY_REPO_DIR@Q} SERVICE_NAME=${DEPLOY_SERVICE_NAME@Q} MIGRATION_SERVICE_NAME=${DEPLOY_MIGRATION_SERVICE_NAME@Q} PUBLIC_BASE_URL=${DEPLOY_PUBLIC_BASE_URL@Q} BLUE_PORT=${DEPLOY_BLUE_PORT@Q} GREEN_PORT=${DEPLOY_GREEN_PORT@Q} DEPLOY_RUN_ID=${DEPLOY_RUN_ID@Q} DEPLOY_RUN_URL=${DEPLOY_RUN_URL@Q} ARTIFACT_PATH=${MIGRATION_REMOTE_ARTIFACT@Q} ARTIFACT_SHA256=${ARTIFACT_SHA256@Q} bash ${MIGRATION_REMOTE_DEPLOY_SCRIPT@Q}; status=\$?; rm -f -- ${MIGRATION_REMOTE_DEPLOY_SCRIPT@Q} ${MIGRATION_REMOTE_ARTIFACT@Q}; exit \$status"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"

      - name: Upload verified artifact and worker deploy script
        if: steps.artifact.outputs.deployable == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          remote_artifact="/tmp/goofish-worker-release-${TARGET_SHA}-${GITHUB_RUN_ID}.tgz"
          remote_deploy_script="/tmp/goofish-worker-deploy-${TARGET_SHA}-${GITHUB_RUN_ID}.sh"
          scp -i ~/.ssh/worker_deploy_key -P "$WORKER_DEPLOY_PORT" -o IdentitiesOnly=yes \
            worker-package/worker.tgz "$WORKER_DEPLOY_USER@$WORKER_DEPLOY_HOST:$remote_artifact"
          scp -i ~/.ssh/worker_deploy_key -P "$WORKER_DEPLOY_PORT" -o IdentitiesOnly=yes \
            scripts/deploy-worker-atomic.sh "$WORKER_DEPLOY_USER@$WORKER_DEPLOY_HOST:$remote_deploy_script"
          echo "WORKER_REMOTE_ARTIFACT=$remote_artifact" >> "$GITHUB_ENV"
          echo "WORKER_REMOTE_DEPLOY_SCRIPT=$remote_deploy_script" >> "$GITHUB_ENV"

      - name: Deploy verified worker release first
        if: steps.artifact.outputs.deployable == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ALLOW_REDEPLOY: ${{ steps.target.outputs.allow_redeploy }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_SHA256: ${{ steps.archives.outputs.worker_archive_sha }}
        run: |
          set -euo pipefail

          remote_command="TARGET_SHA=${TARGET_SHA@Q} ALLOW_REDEPLOY=${ALLOW_REDEPLOY@Q} DEPLOY_ROOT=${WORKER_DEPLOY_ROOT@Q} REPO_DIR=${WORKER_DEPLOY_REPO_DIR@Q} SERVICE_NAME=${WORKER_DEPLOY_SERVICE_NAME@Q} BLUE_HEALTH_PORT=${WORKER_BLUE_HEALTH_PORT@Q} GREEN_HEALTH_PORT=${WORKER_GREEN_HEALTH_PORT@Q} DEPLOY_RUN_ID=${DEPLOY_RUN_ID@Q} DEPLOY_RUN_URL=${DEPLOY_RUN_URL@Q} ARTIFACT_PATH=${WORKER_REMOTE_ARTIFACT@Q} ARTIFACT_SHA256=${ARTIFACT_SHA256@Q} bash ${WORKER_REMOTE_DEPLOY_SCRIPT@Q}; status=\$?; rm -f -- ${WORKER_REMOTE_DEPLOY_SCRIPT@Q} ${WORKER_REMOTE_ARTIFACT@Q}; exit \$status"

          ssh \
            -i ~/.ssh/worker_deploy_key \
            -p "$WORKER_DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$WORKER_DEPLOY_USER@$WORKER_DEPLOY_HOST" \
            "$remote_command"

      - name: Upload verified artifact and API deploy script
        if: steps.artifact.outputs.deployable == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          remote_artifact="/tmp/goofish-public-release-${TARGET_SHA}-${GITHUB_RUN_ID}.tgz"
          remote_deploy_script="/tmp/goofish-production-deploy-${TARGET_SHA}-${GITHUB_RUN_ID}.sh"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            public-package/public.tgz "$DEPLOY_USER@$DEPLOY_HOST:$remote_artifact"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            scripts/deploy-production-atomic.sh "$DEPLOY_USER@$DEPLOY_HOST:$remote_deploy_script"
          echo "REMOTE_ARTIFACT=$remote_artifact" >> "$GITHUB_ENV"
          echo "REMOTE_DEPLOY_SCRIPT=$remote_deploy_script" >> "$GITHUB_ENV"

      - name: Deploy verified API release second
        if: steps.artifact.outputs.deployable == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ALLOW_REDEPLOY: ${{ steps.target.outputs.allow_redeploy }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_SHA256: ${{ steps.archives.outputs.public_archive_sha }}
        run: |
          set -euo pipefail

          remote_command="TARGET_SHA=${TARGET_SHA@Q} ALLOW_REDEPLOY=${ALLOW_REDEPLOY@Q} DEPLOY_ROOT=${DEPLOY_ROOT@Q} REPO_DIR=${DEPLOY_REPO_DIR@Q} SERVICE_NAME=${DEPLOY_SERVICE_NAME@Q} PUBLIC_BASE_URL=${DEPLOY_PUBLIC_BASE_URL@Q} BLUE_PORT=${DEPLOY_BLUE_PORT@Q} GREEN_PORT=${DEPLOY_GREEN_PORT@Q} DEPLOY_RUN_ID=${DEPLOY_RUN_ID@Q} DEPLOY_RUN_URL=${DEPLOY_RUN_URL@Q} ARTIFACT_PATH=${REMOTE_ARTIFACT@Q} ARTIFACT_SHA256=${ARTIFACT_SHA256@Q} bash ${REMOTE_DEPLOY_SCRIPT@Q}; status=\$?; rm -f -- ${REMOTE_DEPLOY_SCRIPT@Q} ${REMOTE_ARTIFACT@Q}; exit \$status"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"

      - name: Publish successful changelog release
        if: steps.artifact.outputs.deployable == 'true' && steps.changelog.outputs.candidate == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_VERSION: ${{ steps.changelog.outputs.version }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        with:
          script: |
            const { readFileSync } = require('fs')
            const envelope = JSON.parse(readFileSync('changelog-release.json', 'utf8'))
            const notes = readFileSync('changelog-release.md', 'utf8')
            const targetSha = String(process.env.TARGET_SHA || '').toLowerCase()
            const version = String(process.env.RELEASE_VERSION || '')
            const tag = String(process.env.RELEASE_TAG || '')
            const { owner, repo } = context.repo

            if (!envelope.candidate || !envelope.release || envelope.release.targetSha !== targetSha) {
              core.setFailed('Changelog release metadata does not match the deployed immutable SHA.')
              return
            }
            if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version) || tag !== `v${version}`) {
              core.setFailed('Changelog release version is invalid.')
              return
            }

            async function resolveTagTarget(ref) {
              if (ref.object.type !== 'tag') return ref.object.sha.toLowerCase()
              const tagObject = await github.rest.git.getTag({ owner, repo, tag_sha: ref.object.sha })
              return tagObject.data.object.sha.toLowerCase()
            }

            try {
              const existingRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })
              const existingTarget = await resolveTagTarget(existingRef.data)
              if (existingTarget !== targetSha) {
                core.setFailed(`Existing ${tag} points to ${existingTarget}, not ${targetSha}.`)
                return
              }
            } catch (error) {
              if (error.status !== 404) throw error
              const tagObject = await github.rest.git.createTag({
                owner,
                repo,
                tag,
                message: `Release ${tag}`,
                object: targetSha,
                type: 'commit',
                tagger: {
                  name: 'github-actions[bot]',
                  email: '41898282+github-actions[bot]@users.noreply.github.com',
                  date: new Date().toISOString(),
                },
              })
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: tagObject.data.sha })
            }

            let release
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data
            } catch (error) {
              if (error.status !== 404) throw error
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: targetSha,
                name: tag,
                body: notes,
                draft: false,
                prerelease: false,
              })).data
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            })
            if (!assets.some((asset) => asset.name === 'changelog-release.json')) {
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: 'changelog-release.json',
                data: readFileSync('changelog-release.json'),
                headers: { 'content-type': 'application/json' },
              })
            }

            core.notice(`Published ${tag} for ${targetSha}.`)
