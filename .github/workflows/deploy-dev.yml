name: Deploy Dev

on:
  workflow_run:
    workflows:
      - Quality Checks
    branches:
      - dev
    types:
      - completed
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Rebuild and restart even if the server already has the target commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dev preview to self-hosted server
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/goofish-infrast-v1-dev' }}
      DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT || '/opt/goofish-infrast-v1-dev/scripts/deploy-production.sh' }}
      DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME || 'goofish-infrast-v1-dev' }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:3001/api/health' }}
      DEPLOY_PUBLIC_BASE_URL: ${{ vars.DEPLOY_PUBLIC_BASE_URL || 'https://dev.maatool.com' }}
      DEPLOY_LOCK_FILE: ${{ vars.DEPLOY_LOCK_FILE || '/tmp/goofish-infrast-v1-dev.deploy.lock' }}
      DEPLOY_BRANCH: dev
      FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy || 'false' }}

    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Secrets in the development environment: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [[ -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Run dev deploy script
        shell: bash
        run: |
          set -euo pipefail

          remote_command="APP_DIR=${DEPLOY_APP_DIR@Q} BRANCH=${DEPLOY_BRANCH@Q} SERVICE_NAME=${DEPLOY_SERVICE_NAME@Q} HEALTH_URL=${DEPLOY_HEALTH_URL@Q} PUBLIC_BASE_URL=${DEPLOY_PUBLIC_BASE_URL@Q} LOCK_FILE=${DEPLOY_LOCK_FILE@Q} FORCE_DEPLOY=${FORCE_DEPLOY@Q} bash ${DEPLOY_SCRIPT@Q}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"
