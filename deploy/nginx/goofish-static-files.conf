# Include this file inside an HTTPS server block after the API proxy snippet.
#
# Nginx does not inherit server-level add_header directives when a location
# defines its own add_header. Re-include the security baseline in both static
# locations so Cache-Control does not suppress document security headers.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript application/xml image/svg+xml text/css text/javascript text/plain;

location ^~ /assets/ {
  include /etc/nginx/snippets/goofish-security-headers.conf;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
  include /etc/nginx/snippets/goofish-security-headers.conf;
  try_files $uri $uri/ /index.html;
  add_header Cache-Control "no-cache";
}
