# Include this file in the nginx http context, usually through /etc/nginx/conf.d/.
map "$uri:$arg_admin" $goofish_admin_rate_key {
  default "";
  ~^/api/admin/ $binary_remote_addr;
  /api/announcement:1 $binary_remote_addr;
  /api/usage-stats:1 $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=goofish_login_ip:10m rate=10r/m;
limit_req_zone $goofish_admin_rate_key zone=goofish_admin_ip:10m rate=5r/s;
