# Include this file in the nginx http context, usually through /etc/nginx/conf.d/.
map "$uri:$arg_admin" $goofish_admin_rate_key {
  default "";
  ~^/api/admin/ $binary_remote_addr;
  /api/announcement:1 $binary_remote_addr;
  /api/usage-stats:1 $binary_remote_addr;
}

map $uri $goofish_auth_sensitive_rate_key {
  default "";
  ~^/api/auth/(register|forgot-password|reset-password|verify-email|resend-verification|change-password)$ $binary_remote_addr;
  /api/admin/session $binary_remote_addr;
}

map $uri $goofish_credential_rate_key {
  default "";
  ~^/api/user/skland/ $binary_remote_addr;
}

map $uri $goofish_compute_rate_key {
  default "";
  /api/analyze-schedule $binary_remote_addr;
  /api/depot-value $binary_remote_addr;
  ~^/api/optimization/ $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=goofish_login_ip:10m rate=10r/m;
limit_req_zone $goofish_admin_rate_key zone=goofish_admin_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=goofish_api_ip:10m rate=120r/m;
limit_req_zone $goofish_auth_sensitive_rate_key zone=goofish_auth_sensitive_ip:10m rate=10r/m;
limit_req_zone $goofish_credential_rate_key zone=goofish_credential_ip:10m rate=30r/m;
limit_req_zone $goofish_compute_rate_key zone=goofish_compute_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=goofish_api_conn:10m;
