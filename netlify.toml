# Legacy Netlify rollback configuration only. The primary production backend now runs
# as a standalone Node service behind Nginx and uses PostgreSQL via DATABASE_URL.
[build]
command = "npm run build"
ignore = "node scripts/netlify-ignore-build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/admin/cdk"
  to = "/.netlify/functions/admin-cdk"
  status = 200

[[redirects]]
  from = "/api/announcement"
  to = "/.netlify/functions/announcement"
  status = 200

[[redirects]]
  from = "/api/admin/announcement"
  to = "/.netlify/functions/announcement?admin=1"
  status = 200

[[redirects]]
  from = "/api/usage-stats"
  to = "/.netlify/functions/usage-stats"
  status = 200

[[redirects]]
  from = "/api/admin/usage-stats"
  to = "/.netlify/functions/usage-stats?admin=1"
  status = 200

[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/user/status"
  to = "/.netlify/functions/user-status"
  status = 200

[[redirects]]
  from = "/api/user/workspace"
  to = "/.netlify/functions/user-workspace"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
