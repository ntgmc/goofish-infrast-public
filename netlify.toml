# Historical Netlify site only.
# The production site runs on the self-hosted server at https://maatool.com/.
# Keep this deploy as a permanent redirect so old Netlify links do not expose a
# stale frontend that cannot reach the production backend.

[build]
command = "node -e \"const fs=require('fs');fs.mkdirSync('dist',{recursive:true});fs.writeFileSync('dist/_redirects','/* https://maatool.com/:splat 301!\\n')\""
publish = "dist"

[[redirects]]
from = "/*"
to = "https://maatool.com/:splat"
status = 301
force = true
